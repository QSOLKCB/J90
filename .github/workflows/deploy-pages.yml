name: Deploy J90 Laboratory

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

# Test/build receives read-only access. Only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for independent parity
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run full test suite
        run: npm test

      - name: Smoke-test research CLI
        run: node src/cli.mjs --omega 1 --damping 0.05 --gap 2 > /dev/null

      - name: Smoke-test adversarial controls
        run: node src/controls-cli.mjs --all > /dev/null

      - name: Smoke-test cross-runtime checkpoint parity
        run: node src/cross-runtime-cli.mjs > /dev/null

      - name: Smoke-test v0.2.2 evidence and stress
        run: node src/evidence-cli.mjs > /dev/null

      - name: Smoke-test nonlinear comparison
        run: node src/nonlinear-cli.mjs > /dev/null

      - name: Smoke-test independent stability and real-axis oracle
        run: node src/stability-cli.mjs > /dev/null

      - name: Smoke-test independent precision zoom experiment
        run: node src/zoom-cli.mjs > /dev/null

      - name: Consolidate nonlinear evidence and verify Python grid parity
        run: node src/consolidate-cli.mjs --out evidence-v0.3.3 > /dev/null

      - name: Record CI environment provenance
        shell: bash
        run: |
          set -euo pipefail
          printf 'node=%s\npython=%s\nos=%s\narch=%s\n'             "$(node --version)" "$(python3 --version)" "$(uname -s)" "$(uname -m)"             > evidence-v0.3.3/environment.txt
          (cd evidence-v0.3.3 && sha256sum environment.txt >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload temporary nonlinear evidence archive
        uses: actions/upload-artifact@v4
        with:
          name: j90-nonlinear-evidence-v0.3.3
          path: evidence-v0.3.3/
          retention-days: 30
          if-no-files-found: error

      - name: Assemble minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/docs
          cp index.html style.css _site/
          cp src/browser.mjs src/core.mjs src/adversarial.mjs src/nonlinear.mjs src/fractal-browser.mjs src/stability.mjs src/stability-browser.mjs src/zoom.mjs src/zoom-browser.mjs _site/src/
          cp docs/ATTRIBUTION.md _site/docs/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/browser.mjs
          test -s _site/src/core.mjs
          test -s _site/src/adversarial.mjs
          test -s _site/src/nonlinear.mjs
          test -s _site/src/fractal-browser.mjs
          test -s _site/src/stability.mjs
          test -s _site/src/stability-browser.mjs
          test -s _site/src/zoom.mjs
          test -s _site/src/zoom-browser.mjs
          test -s _site/docs/ATTRIBUTION.md

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
