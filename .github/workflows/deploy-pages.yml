name: Deploy J90 Laboratory

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

# Test/build receives read-only access. Only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for independent parity
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run full test suite
        run: npm test

      - name: Smoke-test research CLI
        run: node src/cli.mjs --omega 1 --damping 0.05 --gap 2 > /dev/null

      - name: Smoke-test adversarial controls
        run: node src/controls-cli.mjs --all > /dev/null

      - name: Smoke-test cross-runtime checkpoint parity
        run: node src/cross-runtime-cli.mjs > /dev/null

      - name: Assemble minimal Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/docs
          cp index.html style.css _site/
          cp src/browser.mjs src/core.mjs src/adversarial.mjs _site/src/
          cp docs/ATTRIBUTION.md _site/docs/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/browser.mjs
          test -s _site/src/core.mjs
          test -s _site/src/adversarial.mjs
          test -s _site/docs/ATTRIBUTION.md

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
